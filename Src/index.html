<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - HunterX </title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Assets/Icon.png">
</head>
<body>
    <div class="game-container">
        <h1>Tic Tac Toe - HunterX</h1>
        <button id="theme-toggle" class="theme-btn">🌓 Cambiar Modo</button>

        <div id="setup-section">
            <p>Introduce tu nombre para competir:</p>
            <input type="text" id="player-name" placeholder="Tu nombre" maxlength="12">
            <button id="start-game-btn">Empezar Juego</button>
        </div>

        <div id="game-section" style="display: none;">
            <div class="status" id="status">Bienvenido, <span id="display-name"></span>!</div>
            
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <button id="reset-btn">Reiniciar Partida</button>
            <button id="back-to-setup-btn" class="secondary-btn">Cambiar Jugador</button>
        </div>

        <div class="leaderboard-preview">
            <h3>🏆 Salón de la Fama</h3>
            <ul id="leaderboard-list"></ul>
            <button id="view-full-ranking" class="view-more-btn">Ver Ranking Completo</button>
        </div>
    </div>

    <div id="ranking-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>🏆 Ranking Global Completo</h2>
            <div class="modal-scroll-area">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Jugador</th>
                            <th>Victorias</th>
                        </tr>
                    </thead>
                    <tbody id="full-ranking-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
